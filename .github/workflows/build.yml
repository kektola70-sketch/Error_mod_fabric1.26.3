# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        shell: bash
        run: ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
      - name: report build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 55000 /tmp/build.log > /tmp/tail.log || true
          printf '```\n' > /tmp/body.md
          cat /tmp/tail.log >> /tmp/body.md
          printf '\n```\n' >> /tmp/body.md
          jq -Rs '{body: .}' /tmp/body.md > /tmp/body.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/body.json > /dev/null
      - name: list build output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l build/libs/ | tee /tmp/libs.txt
          printf '### build/libs\n```\n' > /tmp/b.md
          cat /tmp/libs.txt >> /tmp/b.md
          printf '\n```\n' >> /tmp/b.md
          jq -Rs '{body: .}' /tmp/b.md > /tmp/b.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/b.json > /dev/null
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
