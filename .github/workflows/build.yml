# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        shell: bash
        run: ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
      - name: report build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 55000 /tmp/build.log > /tmp/tail.log || true
          printf '```\n' > /tmp/body.md
          cat /tmp/tail.log >> /tmp/body.md
          printf '\n```\n' >> /tmp/body.md
          jq -Rs '{body: .}' /tmp/body.md > /tmp/body.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/body.json > /dev/null
      - name: runtime smoke test (boot dedicated server with the mod)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          echo "level-type=minecraft:flat" > run/server.properties
          echo "online-mode=false" >> run/server.properties
          set +e
          timeout 900 ./gradlew runServer --console=plain --stacktrace < <(printf 'stop\n') 2>&1 | tee /tmp/server.log
          set -e
          echo "----- checking startup markers -----"
          grep -q 'Инициализация мода Error' /tmp/server.log && echo "OK: main entrypoint ran"
          grep -q 'Блоки зарегистрированы' /tmp/server.log && echo "OK: blocks registered"
          grep -q 'Предметы и креативная вкладка зарегистрированы' /tmp/server.log && echo "OK: items registered"
          grep -q 'Загрузка мира — мод Error активен' /tmp/server.log && echo "OK: server mixin applied"
          grep -qE 'Done \([0-9.]+s\)' /tmp/server.log && echo "OK: server reached Done"
          {
            printf '### runtime smoke test\n```\n'
            grep -nE 'Инициализация мода Error|Блоки зарегистрированы|Предметы и креативная вкладка|Загрузка мира — мод Error|Done \([0-9.]+s\)|Loading [0-9]+ mods|\berror\b.*1\.0\.0|Mixin apply|Caused by|Exception|FAILED' /tmp/server.log | tail -40
            printf '\n```\n'
          } > /tmp/s.md
          jq -Rs '{body: .}' /tmp/s.md > /tmp/s.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/s.json > /dev/null
          grep -qE 'Done \([0-9.]+s\)' /tmp/server.log
      - name: list build output
        shell: bash
        run: ls -l build/libs/
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
